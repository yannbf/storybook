name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh-aw extension
        uses: github/gh-aw/actions/setup-cli@b2d8af7543ec40f72bb3b8fea5148c2d3ee401c7 # v0.53.4
        with:
          version: v0.53.4

      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true

      - name: Install Playwright browsers
        run: cd code && yarn playwright install --with-deps chromium

      - name: Compile
        run: yarn nx run-many --targets compile --no-cloud
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.COPILOT_NX_CLOUD_ACCESS_TOKEN }}
          NX_NO_CLOUD: true
